name: sokosoo

services:
  api:
    init: true
    build:
      context: ./backend
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      CSRF_TRUSTED_ORIGINS: http://localhost:${SOKOSOO_WEB_PORT:-3010},http://127.0.0.1:${SOKOSOO_WEB_PORT:-3010}
      SOKOSOO_SQLITE_PATH: /data/db.sqlite3
    ports:
      - "127.0.0.1:${SOKOSOO_API_PORT:-8010}:8010"
    volumes:
      - ./backend:/app
      - database:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/session/', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  cleanup:
    init: true
    build:
      context: ./backend
    command: ["python", "manage.py", "cleanup_marketplace", "--loop"]
    environment:
      DJANGO_DEBUG: "1"
      SOKOSOO_SQLITE_PATH: /data/db.sqlite3
    volumes:
      - ./backend:/app
      - database:/data
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure

  web:
    init: true
    build:
      context: .
    environment:
      SOKOSOO_DJANGO_URL: http://api:8010
    ports:
      - "127.0.0.1:${SOKOSOO_WEB_PORT:-3010}:3010"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./next.config.ts:/app/next.config.ts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - next-cache:/app/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 20s
      start_period: 60s
      retries: 5

volumes:
  database:
  next-cache:
